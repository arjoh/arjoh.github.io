name: Build AJH Consultancy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Check existing pages and customizations
        run: python3 tests/check_site.py _site
      - name: Check contact reveal interaction
        run: node --test tests/contact-details.test.cjs
